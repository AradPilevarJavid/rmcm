[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rmcm"
version = "0.2.0"
description = "Remove comments and docstrings from Python, C, CSS, and Rust files"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [{name = "Farbod Khalili Khoshehmehr"}]

[project.scripts]
rmcm = "rmcm:main"

[tool.setuptools]
py-modules = ["rmcm"]
